services:
  db:
    image: mysql:8.0
    container_name: gestao_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestao
      MYSQL_USER: gestao
      MYSQL_PASSWORD: gestao
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: gestao_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  mysql_data: